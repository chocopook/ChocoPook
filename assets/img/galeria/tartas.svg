<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Ilustración provisoria: tarta de frutillas con crema pastelera -->
  <defs>
    <pattern id="cuadrille" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="24" height="24" fill="#fbecd2"/>
      <rect width="12" height="24" fill="#efb566" opacity=".45"/>
      <rect width="24" height="12" fill="#efb566" opacity=".45"/>
    </pattern>
    <g id="frutilla">
      <path d="M0-15c11 0 15 11 11 21-3 6-7 10-11 11-4-1-8-5-11-11-4-10 0-21 11-21z" fill="#cf3a35"/>
      <path d="M0-10c7 0 9 7 7 14-2 4-5 7-7 8-2-1-5-4-7-8-2-7 0-14 7-14z" fill="#ef7564"/>
      <path d="M0-9v17" stroke="#f9b0a3" stroke-width="2" stroke-linecap="round"/>
      <g fill="#fbe3a0">
        <circle cx="-7" cy="-4" r="1"/>
        <circle cx="7" cy="-4" r="1"/>
        <circle cx="-6" cy="5" r="1"/>
        <circle cx="6" cy="5" r="1"/>
      </g>
      <ellipse cx="-4" cy="-9" rx="3" ry="1.6" fill="#fff" opacity=".55"/>
    </g>
  </defs>

  <rect width="400" height="300" fill="#f2dfc4"/>
  <path d="M-20 200L170 320H-20z" fill="url(#cuadrille)"/>
  <path d="M-20 200L170 320" stroke="#e5c3a0" stroke-width="3"/>

  <!-- Tarta -->
  <ellipse cx="200" cy="182" rx="160" ry="100" fill="#573319" opacity=".18"/>
  <ellipse cx="200" cy="168" rx="152" ry="100" fill="#a8692f"/>
  <ellipse cx="200" cy="156" rx="152" ry="98" fill="#dba463"/>
  <ellipse cx="200" cy="156" rx="152" ry="98" fill="none" stroke="#c48446" stroke-width="12" stroke-dasharray="2 13" stroke-linecap="round"/>
  <ellipse cx="200" cy="158" rx="128" ry="80" fill="#f8e3b0"/>
  <ellipse cx="186" cy="146" rx="90" ry="50" fill="#fdf0cc" opacity=".6"/>

  <!-- Frutillas: anillo externo -->
  <use href="#frutilla" transform="translate(300 160) rotate(-90)"/>
  <use href="#frutilla" transform="translate(287 190) rotate(-60)"/>
  <use href="#frutilla" transform="translate(250 212) rotate(-30)"/>
  <use href="#frutilla" transform="translate(200 220)"/>
  <use href="#frutilla" transform="translate(150 212) rotate(30)"/>
  <use href="#frutilla" transform="translate(113 190) rotate(60)"/>
  <use href="#frutilla" transform="translate(100 160) rotate(90)"/>
  <use href="#frutilla" transform="translate(113 130) rotate(120)"/>
  <use href="#frutilla" transform="translate(150 108) rotate(150)"/>
  <use href="#frutilla" transform="translate(200 100) rotate(180)"/>
  <use href="#frutilla" transform="translate(250 108) rotate(210)"/>
  <use href="#frutilla" transform="translate(287 130) rotate(240)"/>
  <!-- anillo interno -->
  <use href="#frutilla" transform="translate(250 160) rotate(-90) scale(.9)"/>
  <use href="#frutilla" transform="translate(225 186) rotate(-30) scale(.9)"/>
  <use href="#frutilla" transform="translate(175 186) rotate(30) scale(.9)"/>
  <use href="#frutilla" transform="translate(150 160) rotate(90) scale(.9)"/>
  <use href="#frutilla" transform="translate(175 134) rotate(150) scale(.9)"/>
  <use href="#frutilla" transform="translate(225 134) rotate(210) scale(.9)"/>

  <!-- Centro: frutilla y menta -->
  <ellipse cx="190" cy="152" rx="12" ry="6" fill="#6fa257" transform="rotate(-30 190 152)"/>
  <ellipse cx="210" cy="152" rx="12" ry="6" fill="#84b866" transform="rotate(30 210 152)"/>
  <use href="#frutilla" transform="translate(200 162) scale(1.05)"/>
</svg>
