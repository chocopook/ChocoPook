<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Ilustración provisoria: empanadas al horno sobre tabla de madera -->
  <defs>
    <linearGradient id="tabla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4865b"/>
      <stop offset="1" stop-color="#88552e"/>
    </linearGradient>
    <radialGradient id="dorado" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f3c77c"/>
      <stop offset=".7" stop-color="#e0a254"/>
      <stop offset="1" stop-color="#c47f35"/>
    </radialGradient>
    <!-- Empanada: lado recto abajo, repulgue sobre la curva -->
    <g id="empanada">
      <path d="M-64 6a64 56 0 0 1 128 0q-64 16-128 0z" fill="#3f220e" opacity=".22" transform="translate(4 8)"/>
      <path d="M-62 0a62 54 0 0 1 124 0q-62 14-124 0z" fill="url(#dorado)"/>
      <path d="M-62 0a62 54 0 0 1 124 0" fill="none" stroke="#d6974b" stroke-width="13"/>
      <path d="M-62 0a62 54 0 0 1 124 0" fill="none" stroke="#b87436" stroke-width="10" stroke-dasharray="1 9.5" stroke-linecap="round"/>
      <path d="M-30-24q14-12 30-10" fill="none" stroke="#fff3d6" stroke-width="5" stroke-linecap="round" opacity=".55"/>
      <g fill="#b87436" opacity=".5">
        <circle cx="10" cy="-14" r="2"/>
        <circle cx="26" cy="-6" r="1.6"/>
        <circle cx="-14" cy="-4" r="1.8"/>
      </g>
    </g>
  </defs>

  <rect width="400" height="300" fill="#3f2a1c"/>
  <rect x="12" y="12" width="376" height="276" rx="18" fill="url(#tabla)"/>
  <g stroke="#724423" stroke-width="2" stroke-linecap="round" opacity=".45" fill="none">
    <path d="M30 60q90-10 180 0t170-6"/>
    <path d="M24 150q120 12 220 0t130 4"/>
    <path d="M30 240q100-12 200 0t150-2"/>
  </g>

  <use href="#empanada" transform="translate(96 104) rotate(-12)"/>
  <use href="#empanada" transform="translate(206 94) rotate(6)"/>
  <use href="#empanada" transform="translate(314 108) rotate(-4)"/>
  <use href="#empanada" transform="translate(146 216) rotate(5)"/>
  <use href="#empanada" transform="translate(268 222) rotate(-9)"/>

  <!-- Ramita de perejil -->
  <g transform="translate(40 250)">
    <path d="M0 0q12-14 30-18" fill="none" stroke="#5f8c46" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="14" cy="-12" rx="7" ry="4" fill="#78a85a" transform="rotate(-30 14 -12)"/>
    <ellipse cx="26" cy="-20" rx="7" ry="4" fill="#6fa257" transform="rotate(-10 26 -20)"/>
    <ellipse cx="22" cy="-8" rx="6" ry="3.5" fill="#84b866" transform="rotate(20 22 -8)"/>
  </g>
</svg>
