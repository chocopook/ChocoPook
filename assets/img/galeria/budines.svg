<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Ilustración provisoria: budín de limón glaseado con una porción cortada -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dbbc"/>
      <stop offset="1" stop-color="#e5c3a0"/>
    </linearGradient>
    <linearGradient id="tabla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c69b74"/>
      <stop offset="1" stop-color="#9b6d44"/>
    </linearGradient>
    <linearGradient id="corteza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset="1" stop-color="#a8692f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#fondo)"/>
  <g fill="#fdf0dc" opacity=".5">
    <circle cx="60" cy="50" r="22"/>
    <circle cx="340" cy="40" r="16"/>
    <circle cx="300" cy="96" r="8"/>
  </g>

  <!-- Tabla -->
  <ellipse cx="200" cy="262" rx="186" ry="18" fill="#573319" opacity=".2"/>
  <rect x="22" y="214" width="356" height="44" rx="14" fill="url(#tabla)"/>
  <rect x="22" y="214" width="356" height="12" rx="6" fill="#d3af8c"/>
  <path d="M60 238h90M190 246h120M80 250h40" stroke="#88552e" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- Budín entero -->
  <path d="M58 218l14-84q2-10 12-10h176q10 0 12 10l14 84z" fill="url(#corteza)"/>
  <path d="M72 128q100-80 200 0z" fill="#a0602c"/>
  <path d="M96 116q76-52 152 0" fill="none" stroke="#7a4220" stroke-width="7" stroke-linecap="round"/>
  <path d="M106 112q66-42 132 0" fill="none" stroke="#f2cf7e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Glaseado -->
  <path d="M80 124l18-18 14 14 18-24 16 16 20-22 18 18 20-20 16 16 18-18 16 18 16-6" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 132v14M132 130v22M176 128v12M222 130v18M262 132v10" stroke="#fffaf0" stroke-width="6" stroke-linecap="round"/>

  <!-- Porción cortada -->
  <g transform="translate(296 150) rotate(10)">
    <path d="M0 4q0-10 10-12 20-12 44 0 10 2 10 12v62q0 8-8 8H8q-8 0-8-8z" fill="#a8692f"/>
    <path d="M7 8q0-6 6-8 18-10 38 0 6 2 6 8v54q0 5-5 5H12q-5 0-5-5z" fill="#f4d58f"/>
    <g fill="#e2b866">
      <ellipse cx="20" cy="16" rx="3" ry="2"/>
      <ellipse cx="38" cy="24" rx="2.6" ry="1.8"/>
      <ellipse cx="26" cy="38" rx="3.2" ry="2.2"/>
      <ellipse cx="46" cy="44" rx="2.4" ry="1.6"/>
      <ellipse cx="18" cy="54" rx="2.6" ry="1.8"/>
      <ellipse cx="36" cy="58" rx="3" ry="2"/>
    </g>
    <path d="M10-6l8 8 10-10 10 8 10-8 8 6" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Limón -->
  <g transform="translate(70 212)">
    <circle r="26" fill="#efb566"/>
    <circle r="22" fill="#f8de8a"/>
    <g stroke="#fff6d6" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 0V-19M0 0l13.4-13.4M0 0H19M0 0l13.4 13.4M0 0V19M0 0l-13.4 13.4M0 0H-19M0 0l-13.4-13.4"/>
    </g>
    <circle r="3" fill="#fff6d6"/>
  </g>
</svg>
