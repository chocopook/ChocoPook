    <circle cx="172" cy="94" r="27" fill="#cd9d70"/>
  </g>
  <circle cx="48" cy="94" r="13.5" fill="#e8c19a"/>
  <circle cx="172" cy="94" r="13.5" fill="#e8c19a"/>

  <!-- Cabeza -->
  <ellipse cx="110" cy="136" rx="79" ry="64" fill="#cd9d70" stroke="#573319" stroke-width="6"/>
  <ellipse cx="110" cy="160" rx="32" ry="23" fill="#f6dfc0"/>
  <ellipse cx="60" cy="154" rx="12" ry="7.5" fill="#eea58f" opacity=".75"/>
  <ellipse cx="160" cy="154" rx="12" ry="7.5" fill="#eea58f" opacity=".75"/>

  <!-- Ojos -->
