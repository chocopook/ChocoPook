  <ellipse cx="141" cy="133" rx="8.5" ry="9.5" fill="#3f220e"/>
  <circle cx="81.8" cy="129.2" r="2.8" fill="#fff"/>
  <circle cx="143.8" cy="129.2" r="2.8" fill="#fff"/>

