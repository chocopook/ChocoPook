  </g>
  <path d="M83 52q4-10 14-12M112 24q8 2 11 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <path d="M97 64v14M110 62v17M123 64v14" stroke="#ead6b8" stroke-width="3.2" stroke-linecap="round"/>
