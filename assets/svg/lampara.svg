<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170">
  <!-- Lámpara colgante: cuelga de la viga del toldo e ilumina la receta del día.
       El halo de luz se dibuja en CSS (.lampara::after) para que salga del dibujo. -->
  <defs>
    <linearGradient id="bronce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6d34"/><stop offset=".45" stop-color="#d9b06a"/><stop offset="1" stop-color="#8a5e2c"/>
    </linearGradient>
    <linearGradient id="esmalte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6b55"/><stop offset=".35" stop-color="#7d9b80"/><stop offset="1" stop-color="#465f4b"/>
    </linearGradient>
    <radialGradient id="foco" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff2c2"/><stop offset="1" stop-color="#f7d98a"/>
    </radialGradient>
    <radialGradient id="brillo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- florón en la viga y cable -->
  <rect x="44" y="0" width="32" height="7" rx="2" fill="url(#bronce)"/>
  <path d="M60 7v86" stroke="#3a2a22" stroke-width="3"/>

  <!-- portalámparas -->
  <path d="M53 92h14v12q0 4-4 4h-6q-4 0-4-4z" fill="url(#bronce)"/>
  <rect x="51" y="90" width="18" height="4" rx="2" fill="#c99a55"/>

  <!-- pantalla esmaltada -->
  <path d="M16 150C18 126 36 108 60 108S102 126 104 150Z" fill="url(#esmalte)"/>
  <path d="M28 140C32 124 44 114 58 112" fill="none" stroke="#b8cdb4" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  <ellipse cx="60" cy="109" rx="10" ry="3" fill="#c99a55"/>

  <!-- boca de la pantalla: interior crema iluminado y foco -->
  <ellipse cx="60" cy="152" rx="40" ry="16" fill="url(#brillo)"/>
  <ellipse cx="60" cy="150" rx="44" ry="7" fill="#f6ecd8"/>
  <ellipse cx="60" cy="150" rx="44" ry="7" fill="none" stroke="#3f5646" stroke-width="2"/>
  <ellipse cx="60" cy="153" rx="12" ry="8" fill="url(#foco)"/>
</svg>
