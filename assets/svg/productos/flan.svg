<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: flan casero con agujero al centro, bañado en caramelo, sobre un plato -->
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2a83e"/><stop offset=".45" stop-color="#f6d27a"/><stop offset="1" stop-color="#d79a34"/>
    </linearGradient>
  </defs>
  <!-- plato -->
  <ellipse cx="50" cy="76" rx="45" ry="14" fill="#fffaf2" stroke="#4f2e18" stroke-width="3"/>
  <!-- charco de caramelo -->
  <path d="M14 74c2-6 14-9 36-9s34 3 36 9c-4 5-20 7-36 7s-32-2-36-7z" fill="#a85a1a"/>
  <g stroke="#4f2e18" stroke-width="3" stroke-linejoin="round">
    <!-- costado -->
    <path d="M22 42L18 68A32 9 0 0 0 82 68L78 42Z" fill="url(#cuerpo)"/>
    <!-- arriba, con caramelo -->
    <ellipse cx="50" cy="42" rx="28" ry="9" fill="#b8661e"/>
  </g>
  <!-- agujero del centro -->
  <ellipse cx="50" cy="42" rx="7.5" ry="2.6" fill="#5e3216" stroke="#4f2e18" stroke-width="2"/>
  <!-- caramelo que cae por los costados -->
  <path d="M24 46q2 8 0 12q3 2 3-4q1-5 2-8zM40 50q1 7-1 11q3 1 3-3q0-5 1-8zM62 50q1 6 0 9q3 1 2-3q0-4-0-6zM74 46q0 7-2 10q3 1 3-3q1-4 1-7z" fill="#b8661e"/>
  <path d="M33 39q8-4 18-4" fill="none" stroke="#e9a35a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M28 54v10" stroke="#fff3c8" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
