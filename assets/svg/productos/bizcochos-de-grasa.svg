<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: bizcochos de grasa, redonditos y hojaldrados, uno detrás de otro -->
  <defs>
    <radialGradient id="tostado" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f2cd84"/><stop offset="1" stop-color="#d79a4e"/>
    </radialGradient>
    <!-- un bizcocho: cara de arriba en y=0, espesor de 11 con capas de masa en el costado -->
    <g id="bizcocho">
      <path d="M-20 0V11A20 7 0 0 0 20 11V0Z" fill="#e9c58a" stroke="#4f2e18" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-19 4.5A19 6.5 0 0 0 19 4.5M-19 8A19 6.5 0 0 0 19 8" fill="none" stroke="#c98f4a" stroke-width="1.4"/>
      <ellipse rx="20" ry="7" fill="url(#tostado)" stroke="#4f2e18" stroke-width="3"/>
      <ellipse rx="11" ry="3.6" fill="none" stroke="#c98a42" stroke-width="1.6"/>
      <path d="M-12-2q5-3 10-2" fill="none" stroke="#fbe6b4" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>
  <use href="#bizcocho" transform="translate(32 40)"/>
  <use href="#bizcocho" transform="translate(68 42)"/>
  <use href="#bizcocho" transform="translate(50 56)"/>
  <use href="#bizcocho" transform="translate(28 70)"/>
  <use href="#bizcocho" transform="translate(70 72)"/>
</svg>
