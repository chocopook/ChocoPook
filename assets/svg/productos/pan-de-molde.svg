<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: pan de molde con una rebanada apoyada adelante -->
  <defs>
    <linearGradient id="corteza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4b"/><stop offset="1" stop-color="#a8692f"/>
    </linearGradient>
    <!-- cara cortada: base recta y copete redondeado -->
    <path id="cara" d="M0 0V-22Q0-34 10-36Q16-40 22-36Q32-34 32-22V0Z"/>
  </defs>
  <g stroke="#4f2e18" stroke-width="3" stroke-linejoin="round">
    <!-- cuerpo del pan, hacia atrás a la derecha -->
    <path d="M40 80V58Q40 46 50 44Q56 40 62 44L82 32Q92 30 92 42V66L72 80Z" fill="url(#corteza)"/>
    <!-- copete de arriba -->
    <path d="M50 44Q56 40 62 44Q72 46 72 58L92 46Q92 30 82 32Q76 28 70 32Z" fill="#d9a35e"/>
  </g>
  <!-- cara cortada del pan -->
  <use href="#cara" transform="translate(40 80)" fill="#c98a4b" stroke="#4f2e18" stroke-width="3" stroke-linejoin="round"/>
  <use href="#cara" transform="translate(43 77) scale(.81)" fill="#f8e6bc"/>
  <!-- rebanada apoyada -->
  <g transform="translate(10 88) rotate(-12)">
    <use href="#cara" fill="#c98a4b" stroke="#4f2e18" stroke-width="3" stroke-linejoin="round"/>
    <use href="#cara" transform="translate(3 -3) scale(.81)" fill="#fbecc8"/>
    <g fill="#e8cf96">
      <circle cx="10" cy="-14" r="1.2"/><circle cx="18" cy="-20" r="1.1"/><circle cx="22" cy="-10" r="1.2"/><circle cx="12" cy="-24" r="1"/><circle cx="16" cy="-6" r="1"/>
    </g>
  </g>
  <!-- miga de la cara del pan -->
  <g fill="#e8cf96">
    <circle cx="50" cy="66" r="1.1"/><circle cx="58" cy="58" r="1.2"/><circle cx="62" cy="70" r="1.1"/><circle cx="54" cy="52" r="1"/>
  </g>
  <path d="M66 40q8-6 16-8" fill="none" stroke="#f0c98a" stroke-width="2.2" stroke-linecap="round"/>
</svg>
