<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: torta chajá, cubierta de crema con duraznos y merengue -->
  <defs>
    <linearGradient id="crema" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe3cf"/><stop offset=".45" stop-color="#fffaf2"/><stop offset="1" stop-color="#e8dac2"/>
    </linearGradient>
    <g id="copo">
      <circle r="5" fill="#fffdf8" stroke="#4f2e18" stroke-width="2"/>
      <path d="M-2-1q2-2 4 0" fill="none" stroke="#e5d6c0" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <path id="durazno" d="M-5 2C-6-3-1-6 4-5 6-1 3 4-2 4z" fill="#f5a23c" stroke="#4f2e18" stroke-width="1.8" stroke-linejoin="round"/>
  </defs>
  <!-- base dorada -->
  <ellipse cx="50" cy="78" rx="44" ry="12" fill="#f2c45a" stroke="#4f2e18" stroke-width="3"/>
  <g stroke="#4f2e18" stroke-width="3" stroke-linejoin="round">
    <!-- costado de crema -->
    <path d="M12 42V72A38 11 0 0 0 88 72V42Z" fill="url(#crema)"/>
    <!-- arriba -->
    <ellipse cx="50" cy="42" rx="38" ry="12" fill="#fffaf2"/>
  </g>
  <!-- merengue triturado en el costado -->
  <g fill="#f3e3c4">
    <circle cx="20" cy="60" r="1.6"/><circle cx="28" cy="66" r="1.4"/><circle cx="38" cy="62" r="1.6"/><circle cx="50" cy="67" r="1.4"/>
    <circle cx="61" cy="61" r="1.6"/><circle cx="71" cy="66" r="1.4"/><circle cx="80" cy="59" r="1.6"/><circle cx="44" cy="56" r="1.2"/>
  </g>
  <!-- copos de crema en el borde -->
  <use href="#copo" transform="translate(16 44)"/><use href="#copo" transform="translate(84 44)"/>
  <use href="#copo" transform="translate(26 51)"/><use href="#copo" transform="translate(74 51)"/>
  <use href="#copo" transform="translate(39 54)"/><use href="#copo" transform="translate(61 54)"/>
  <use href="#copo" transform="translate(50 55)"/>
  <!-- duraznos -->
  <use href="#durazno" transform="translate(34 40) rotate(-20)"/>
  <use href="#durazno" transform="translate(52 36) rotate(30)"/>
  <use href="#durazno" transform="translate(66 42) rotate(-60)"/>
  <use href="#durazno" transform="translate(45 46) rotate(80)"/>
  <!-- miguitas de merengue arriba -->
  <g fill="#f3e3c4">
    <circle cx="28" cy="38" r="1.4"/><circle cx="60" cy="33" r="1.2"/><circle cx="74" cy="38" r="1.4"/><circle cx="42" cy="34" r="1.2"/>
  </g>
</svg>
