<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: pionono arrollado con dulce de leche y azúcar impalpable -->
  <defs>
    <linearGradient id="bizcochuelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b36a"/><stop offset=".55" stop-color="#d99a50"/><stop offset="1" stop-color="#b9773a"/>
    </linearGradient>
  </defs>
  <!-- rollo acostado, hacia atrás a la derecha -->
  <path d="M30 37H82A12 23 0 0 1 82 83H30Z" fill="url(#bizcochuelo)" stroke="#4f2e18" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- azúcar impalpable arriba -->
  <path d="M34 41H82" stroke="#fffaf2" stroke-width="5" stroke-linecap="round" stroke-dasharray=".5 4.5" opacity=".95"/>
  <path d="M36 47H86" stroke="#fffaf2" stroke-width="3.5" stroke-linecap="round" stroke-dasharray=".5 6" opacity=".8"/>
  <path d="M40 76H84" stroke="#a8692f" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
  <!-- corte: bizcochuelo en espiral con dulce de leche -->
  <ellipse cx="30" cy="60" rx="16" ry="23" fill="#c98a4b" stroke="#4f2e18" stroke-width="3.5"/>
  <ellipse cx="30" cy="60" rx="13" ry="20" fill="#fbe7b8"/>
  <path d="M30 60a2.2 3 0 0 1 4.4 0a4.4 6 0 0 1-8.8 0a6.6 9 0 0 1 13.2 0a8.8 12 0 0 1-17.6 0a11 15.5 0 0 1 22 0" fill="none" stroke="#9a5a26" stroke-width="3.2" stroke-linecap="round"/>
</svg>
