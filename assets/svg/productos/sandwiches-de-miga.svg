      <g fill="#eedfc0"><circle cx="44" cy="48" r="1.1"/><circle cx="56" cy="44" r="1"/><circle cx="62" cy="54" r="1.1"/><circle cx="36" cy="57" r="1"/><circle cx="50" cy="56" r="1"/></g>
