<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: sorrentinos frescos sobre una tabla enharinada -->
  <defs>
    <linearGradient id="tabla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b97f"/><stop offset="1" stop-color="#c9955a"/>
    </linearGradient>
    <radialGradient id="cupula" cx="40%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff4cf"/><stop offset=".65" stop-color="#f6dc98"/><stop offset="1" stop-color="#e3bd6c"/>
    </radialGradient>
    <!-- un sorrentino en perspectiva: ala plana repulgada y cúpula rellena en el centro -->
    <g id="sorrentino">
      <ellipse cy="2" rx="19" ry="9.5" fill="#4f2e18"/>
      <ellipse rx="19" ry="9.5" fill="#f3d995" stroke="#4f2e18" stroke-width="3"/>
      <ellipse rx="15.5" ry="7.4" fill="none" stroke="#d9b465" stroke-width="3" stroke-dasharray="1.2 3.2" stroke-linecap="round"/>
      <path d="M-11 0c0-8 5-13 11-13s11 5 11 13c-3 3-19 3-22 0z" fill="url(#cupula)" stroke="#4f2e18" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M-6-6q3-4 7-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
    </g>
  </defs>

  <!-- tabla de madera -->
  <path d="M8 60h84q5 0 5 5v14q0 5-5 5H8q-5 0-5-5V65q0-5 5-5z" fill="#a8703f" stroke="#4f2e18" stroke-width="3" stroke-linejoin="round"/>
  <path d="M8 58h84q5 0 5 5v8q0 5-5 5H8q-5 0-5-5v-8q0-5 5-5z" fill="url(#tabla)" stroke="#4f2e18" stroke-width="3" stroke-linejoin="round"/>
  <path d="M14 63h30M56 70h30" stroke="#b5834f" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
  <!-- harina -->
  <path d="M10 66c8-4 20-4 26 0-6 3-20 3-26 0zM62 62c8-3 18-2 24 1-6 3-18 3-24-1z" fill="#fffdf8" opacity=".75"/>

  <!-- sorrentinos: atrás al centro, adelante a los costados -->
  <use href="#sorrentino" transform="translate(50 44)"/>
  <use href="#sorrentino" transform="translate(29 62)"/>
  <use href="#sorrentino" transform="translate(71 62)"/>

  <!-- pizcas de harina y albahaca -->
  <g fill="#fffdf8">
    <circle cx="14" cy="74" r="1.2"/><circle cx="48" cy="72" r="1"/><circle cx="88" cy="72" r="1.2"/><circle cx="52" cy="66" r=".9"/>
  </g>
  <g stroke="#4f2e18" stroke-width="2" stroke-linejoin="round">
    <path d="M78 36c-1-8 5-12 12-11-1 7-6 11-12 11z" fill="#6f9a52"/>
    <path d="M78 36c-6-3-12-1-13 5 6 1 11-1 13-5z" fill="#88b866"/>
  </g>
</svg>
