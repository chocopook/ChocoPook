<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Producto: alfajor de chocolate y alfajor de maicena con coco, en diagonal.
       Mismas formas que assets/img/galeria/alfajores.svg, con el contorno de los íconos. -->
  <defs>
    <!-- Alfajor de chocolate: la cara superior está en y=0 -->
    <g id="choco">
      <path d="M-60 0V34A60 16 0 0 0 60 34V0A60 16 0 0 0-60 0Z" fill="#4f2e18" stroke="#4f2e18" stroke-width="12" stroke-linejoin="round"/>
      <path d="M-60 20v14a60 16 0 0 0 120 0V20z" fill="#4a2817"/>
      <path d="M-56 13v8a56 15 0 0 0 112 0v-8z" fill="#d99a50"/>
      <path d="M-60 0v14a60 16 0 0 0 120 0V0z" fill="#573319"/>
      <ellipse rx="60" ry="16" fill="#6b3f22"/>
      <ellipse cx="-14" cy="-4" rx="28" ry="6" fill="#88552e" opacity=".6"/>
      <path d="M-40 2q10-8 20 0t20 0 20 0 20 0" fill="none" stroke="#3f220e" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    </g>
    <!-- Alfajor de maicena con coco -->
    <g id="maicena">
      <path d="M-58 0V34A58 15 0 0 0 58 34V0A58 15 0 0 0-58 0Z" fill="#4f2e18" stroke="#4f2e18" stroke-width="12" stroke-linejoin="round"/>
      <path d="M-58 22v12a58 15 0 0 0 116 0V22z" fill="#e9cf9c"/>
      <path d="M-55 11v12a55 14 0 0 0 110 0V11z" fill="#b87436"/>
      <g fill="#fffaf0">
        <circle cx="-50" cy="21" r="2.6"/>
        <circle cx="-38" cy="27" r="2.4"/>
        <circle cx="-24" cy="31" r="2.6"/>
        <circle cx="-8" cy="33" r="2.4"/>
        <circle cx="8" cy="33" r="2.6"/>
        <circle cx="24" cy="31" r="2.4"/>
        <circle cx="38" cy="27" r="2.6"/>
        <circle cx="50" cy="21" r="2.4"/>
        <circle cx="-44" cy="28" r="1.8"/>
        <circle cx="-16" cy="35" r="1.8"/>
        <circle cx="16" cy="35" r="1.8"/>
        <circle cx="44" cy="28" r="1.8"/>
      </g>
      <path d="M-58 0v12a58 15 0 0 0 116 0V0z" fill="#ead3a4"/>
      <ellipse rx="58" ry="15" fill="#f6e6c2"/>
      <g fill="#fff" opacity=".85">
        <circle cx="-20" cy="-4" r="1.4"/>
        <circle cx="4" cy="2" r="1.2"/>
        <circle cx="22" cy="-6" r="1.4"/>
        <circle cx="-34" cy="4" r="1.2"/>
        <circle cx="34" cy="5" r="1.2"/>
        <circle cx="-6" cy="-9" r="1.2"/>
      </g>
    </g>
  </defs>

  <!-- maicena atrás, a la derecha; chocolate adelante, a la izquierda -->
  <use href="#maicena" transform="translate(62 34) scale(.54)"/>
  <use href="#choco" transform="translate(39 60) scale(.54)"/>
</svg>
