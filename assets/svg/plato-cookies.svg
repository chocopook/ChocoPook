        <ellipse cx="24" cy="-1.5" rx="3.2" ry="1.4"/>
      </g>
    </g>
  </defs>

  <!-- Sombra y plato -->
  <ellipse cx="160" cy="166" rx="152" ry="28" fill="#573319" opacity=".18"/>
  <ellipse cx="160" cy="154" rx="150" ry="38" fill="url(#loza)" stroke="#e2d4bf" stroke-width="2"/>
  <ellipse cx="160" cy="150" rx="112" ry="25" fill="#f5efe5" stroke="#e8dccb" stroke-width="2"/>

  <!-- Pila de cookies (de atrás hacia adelante) -->
  <use href="#cookie" transform="translate(104 128) rotate(-4)"/>
  <use href="#cookie" transform="translate(216 126) rotate(5)"/>
  <use href="#cookie" transform="translate(134 106) rotate(-8)"/>
  <use href="#cookie" transform="translate(192 100) rotate(6)"/>
  <use href="#cookie" transform="translate(162 80) rotate(-2)"/>
  <use href="#cookie" transform="translate(160 146) rotate(2)"/>

  <!-- Miguitas -->
  <g fill="#c48a4d">
    <circle cx="60" cy="160" r="2.4"/>
    <circle cx="70" cy="167" r="1.6"/>
    <circle cx="258" cy="163" r="2"/>
    <circle cx="248" cy="170" r="1.4"/>
