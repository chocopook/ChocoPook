      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe6d8"/>
    </radialGradient>
    <g id="cookie">
      <ellipse cy="9" rx="52" ry="22" fill="#9b5f30"/>
      <ellipse rx="52" ry="22" fill="#cf9455"/>
      <ellipse cx="-7" cy="-4" rx="37" ry="13" fill="#dcaa69" opacity=".75"/>
      <path d="M-24-2q9-5 16 1M10 7q8-3 13 2" fill="none" stroke="#b07440" stroke-width="2.2" stroke-linecap="round"/>
      <g fill="#3f220e">
        <ellipse cx="-24" cy="-9" rx="7" ry="3.6"/>
        <ellipse cx="9" cy="-12" rx="6" ry="3"/>
        <ellipse cx="26" cy="0" rx="7.5" ry="3.8"/>
        <ellipse cx="-5" cy="3" rx="6.5" ry="3.3"/>
        <ellipse cx="-34" cy="7" rx="5" ry="2.8"/>
        <ellipse cx="11" cy="13" rx="6" ry="3"/>
        <ellipse cx="37" cy="-9" rx="4.2" ry="2.4"/>
      </g>
      <g fill="#6b3f22">
